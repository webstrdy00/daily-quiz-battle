[build]
  command = "pnpm --filter @daily-quiz-battle/contracts build && pnpm --filter @daily-quiz-battle/api build && pnpm --filter @daily-quiz-battle/admin build"
  publish = "apps/api/public"
  functions = "apps/api/src/netlify"

[build.environment]
  NODE_VERSION = "24"
  VITE_ADMIN_API_BASE_URL = "/"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "apps/api/ssl/supabase-prod-ca-2021.crt",
    "!.env",
    "!.env.*",
    "!**/.env",
    "!**/.env.*",
    "!secrets/**",
    "!.secrets/**",
    "!certs/**",
  ]
