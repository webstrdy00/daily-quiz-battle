services:
  postgres:
    image: postgres:18.6-alpine
    container_name: daily-quiz-battle-postgres
    environment:
      POSTGRES_DB: daily_quiz
      POSTGRES_USER: daily_quiz
      POSTGRES_PASSWORD: daily_quiz_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_quiz -d daily_quiz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - daily_quiz_postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  daily_quiz_postgres_data:
