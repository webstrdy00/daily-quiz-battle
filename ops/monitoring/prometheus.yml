global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: daily-quiz-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials: local-only-metrics-access-token-do-not-use-in-production
    static_configs:
      - targets:
          - api:3000
